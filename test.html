<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>拍照取件 · 测试页</title>
<style>
  :root{ --green:#07c160; --green-dark:#06ad56; --ink:#16181d; --sub:#6b7280;
    --bg:#f5f6f8; --card:#fff; --line:#e6e8ec; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);min-height:100vh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  .wrap{max-width:760px;margin:0 auto;padding:14px 14px 40px}
  .head{display:flex;align-items:center;gap:10px;padding:6px 2px 14px}
  .head h1{font-size:17px;margin:0;font-weight:600}
  .head .tag{font-size:11px;color:var(--sub);border:1px solid var(--line);background:#fff;padding:2px 7px;border-radius:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;
    box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .card+.card{margin-top:14px}
  .card h2{font-size:14px;margin:0 0 10px;font-weight:600;display:flex;align-items:center;gap:8px}
  .muted{color:var(--sub);font-size:12px;line-height:1.6;margin:8px 0 0}
  .tiny{font-size:11px;color:var(--sub)}
  .btn{border:0;border-radius:10px;font-size:15px;padding:12px 16px;cursor:pointer;font-family:inherit;transition:.15s;
    display:inline-flex;align-items:center;justify-content:center;gap:8px}
  .btn:active{transform:scale(.985)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-pri{background:var(--green);color:#fff;font-size:16px;padding:15px}
  .btn-pri:hover{background:var(--green-dark)}
  .btn-sec{background:#fff;border:1px solid #d7dbe2;color:var(--ink);font-size:15px;padding:15px}
  .btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink);font-size:12px;padding:5px 10px}
  .btn-ghost:hover{border-color:#cfd3da}
  .acts{display:flex;gap:10px}
  .acts .btn{flex:1}

  /* 取件码 */
  .codeRow{display:flex;align-items:center;gap:12px}
  .codeInput{width:96px;height:60px;text-align:center;font-size:34px;font-weight:700;letter-spacing:6px;
    border:1.5px solid var(--line);border-radius:12px;background:#fafbfc;color:var(--ink);
    font-family:ui-monospace,Consolas,monospace}
  .codeInput:focus{outline:none;border-color:var(--green);background:#fff}

  /* 照片 */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:6px}
  .ph{position:relative;border-radius:10px;overflow:hidden;background:#eef0f3;aspect-ratio:1/1;border:1px solid var(--line)}
  .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .ph .meta{position:absolute;left:0;right:0;bottom:0;padding:12px 6px 4px;font-size:10px;color:#fff;
    background:linear-gradient(transparent,rgba(0,0,0,.55))}
  .ph.new{animation:pop .5s ease}
  @keyframes pop{0%{transform:scale(.92);box-shadow:0 0 0 2px var(--green)}100%{transform:scale(1)}}
  .empty{text-align:center;padding:22px 10px;color:var(--sub);font-size:13px}
  .spin{width:26px;height:26px;border:3px solid #e9f7ef;border-top-color:var(--green);border-radius:50%;
    display:inline-block;vertical-align:-6px;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .codeBig{font-size:40px;font-weight:800;letter-spacing:10px;color:var(--green-dark);
    font-family:ui-monospace,Consolas,monospace;text-align:center;padding:8px 0 2px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);
    background:#1f2430;color:#fff;font-size:13px;padding:10px 16px;border-radius:10px;
    opacity:0;pointer-events:none;transition:.22s;z-index:60;max-width:86vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media(max-width:520px){ .wrap{padding:10px 10px 60px} .grid{grid-template-columns:repeat(3,1fr)} }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>拍照取件 · 测试页</h1>
    <span class="tag" id="modeTag">检测连接中…</span>
  </div>

  <!-- ===== 存（手机） ===== -->
  <div class="card" id="cardUp">
    <h2>存照片（手机用）</h2>
    <div class="codeRow">
      <input class="codeInput" id="codeUp" inputmode="numeric" maxlength="2" placeholder="00">
      <span class="tiny" style="flex:1">两位数取件码，手机与电脑保持一致<br>可手动修改，也可点右侧换一个</span>
      <button class="btn btn-ghost" id="btnNewCode">换一个</button>
    </div>
    <div class="acts" style="margin-top:12px">
      <button class="btn btn-pri" id="btnCamera">📷 拍照</button>
      <button class="btn btn-sec" id="btnAlbum">🖼 从相册选择</button>
    </div>
    <p class="muted" id="upStatus">拍两张照片，就会存进上面的取件码里。</p>
  </div>

  <!-- ===== 取（电脑） ===== -->
  <div class="card" id="cardGet">
    <h2>取照片（电脑用）</h2>
    <div class="codeRow">
      <input class="codeInput" id="codeGet" inputmode="numeric" maxlength="2" placeholder="00">
      <button class="btn btn-pri" id="btnOpen" style="flex:1">打开这个取件码的照片</button>
    </div>
    <p class="muted tiny" id="getStatus" style="margin-top:8px">输入手机上显示的两位数取件码即可查看。</p>
    <div class="grid" id="grid" style="display:none"></div>
    <div class="empty" id="emptyBox" style="display:none"><span style="font-size:26px;display:block;margin-bottom:6px">📭</span>该取件码下还没有照片</div>
  </div>

    <p class="tiny" style="margin-top:14px;text-align:center">
    测试页 · 电脑端 localhost 取照片 · 手机端 IP 地址存照片 · 取件码即房间号，无其他密码
  </p>
</div>

<input type="file" id="fileCamera" accept="image/*" capture="environment" hidden>
<input type="file" id="fileAlbum" accept="image/*" multiple hidden>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let toastTimer=null;
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2400); }

/* ---------- 取件码 ---------- */
function randomCode(){ return String(10 + Math.floor(Math.random()*90)); }   // 10~99
function getUpCode(){ const v=$('codeUp').value.trim(); return /^\d{2}$/.test(v)? v : null; }
function setCode(v){ $('codeUp').value=v; localStorage.setItem('boxcode', v); }
$('codeUp').addEventListener('input', ()=>{ $('codeUp').value=$('codeUp').value.replace(/\D/g,'').slice(0,2);
  if(/^\d{2}$/.test($('codeUp').value)) localStorage.setItem('boxcode', $('codeUp').value); });
$('btnNewCode').addEventListener('click', ()=>{ setCode(randomCode()); toast('新取件码：'+$('codeUp').value); });

/* ---------- 连接检测 ---------- */
let serverOK=false;
/* 角色判定：localhost / 127.0.0.1 = 电脑端（取照片）；用 IP 打开 = 手机端（存照片） */
const IS_PC = (location.hostname==='localhost' || location.hostname==='127.0.0.1');
$('cardUp').style.display  = IS_PC ? 'none' : '';   // 电脑端完全隐藏存照片
$('cardGet').style.display = IS_PC ? '' : 'none';   // 手机端完全隐藏取照片
async function detect(){
  try{
    const r=await fetch('/api/ping',{cache:'no-store'});
    const j=await r.json(); serverOK=!!(j&&j.ok);
  }catch(e){ serverOK=false; }
  $('modeTag').textContent = (IS_PC? '电脑端 · 取照片' : '手机端 · 存照片') + (serverOK? ' · 服务已连接' : ' · 未连接服务');
  $('modeTag').style.color = serverOK? '#06ad56' : '#b45309';
  if(!serverOK) $('upStatus').textContent='⚠ 未检测到 server.js 服务：直接双击打开本文件无法跨设备同步，请先启动同步服务，再通过 http://电脑IP:8788/test.html 访问。';
}

/* ---------- 上传 ---------- */
function compress(file, maxSide=1280, quality=0.82){
  return new Promise(resolve=>{
    const url=URL.createObjectURL(file); const img=new Image();
    img.onload=()=>{
      try{
        const s=Math.min(1, maxSide/Math.max(img.naturalWidth,img.naturalHeight));
        const c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(img.naturalWidth*s)); c.height=Math.max(1,Math.round(img.naturalHeight*s));
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        resolve(c.toDataURL('image/jpeg',quality));
      }catch(e){ resolve(null); } finally{ URL.revokeObjectURL(url); }
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); resolve(null); };
    img.src=url;
  });
}
const readAsDataURL=f=>new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>res(null); r.readAsDataURL(f); });

let uploaded=0;
async function handleFiles(files){
  const code=getUpCode();
  if(!code){ toast('请先填写两位数取件码'); return; }
  if(!serverOK){ toast('服务未连接，请先用 start-server.bat 启动'); return; }
  const arr=Array.from(files||[]).filter(f=>f.type.startsWith('image/'));
  if(!arr.length){ toast('没有可用的图片'); return; }
  $('upStatus').innerHTML='<span class="spin"></span> 正在上传 0/'+arr.length+' …';
  let done=0, fail=0;
  for(const f of arr){
    try{
      let dataUrl=await compress(f);
      if(!dataUrl) dataUrl=await readAsDataURL(f);
      if(!dataUrl) throw new Error('read fail');
      const r=await fetch('/api/upload',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ room:code, dataUrl, from:'mobile', userName:'手机', name:f.name, ts:Date.now() })});
      if(!r.ok) throw new Error('HTTP '+r.status);
      done++; uploaded++;
      $('upStatus').innerHTML='<span class="spin"></span> 正在上传 '+done+'/'+arr.length+' …';
    }catch(e){ fail++; }
  }
  if(fail) $('upStatus').textContent=`已存 ${done} 张，${fail} 张失败`;
  else $('upStatus').textContent=`已存 ${done} 张照片到取件码「${code}」。在电脑端输入这个号码即可查看。`;
  toast(done? `已存入取件码 ${code}`:'上传失败');
  if(done && code===$('codeGet').value.trim()) openBox(code, true);   // 同页自查
}
$('btnCamera').addEventListener('click', ()=>$('fileCamera').click());
$('btnAlbum').addEventListener('click', ()=>$('fileAlbum').click());
$('fileCamera').addEventListener('change', e=>{ handleFiles(e.target.files); e.target.value=''; });
$('fileAlbum').addEventListener('change',  e=>{ handleFiles(e.target.files); e.target.value=''; });

/* ---------- 取件 ---------- */
async function openBox(code, quiet){
  const g=$('grid'), empty=$('emptyBox'), st=$('getStatus');
  if(!serverOK){ st.textContent='⚠ 服务未连接，请先启动 start-server.bat。'; return; }
  st.innerHTML='<span class="spin"></span> 正在读取取件码「'+code+'」…';
  g.style.display='none'; empty.style.display='none';
  try{
    const r=await fetch('/api/photos?room='+encodeURIComponent(code),{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j=await r.json();
    const list=(j.photos||[]).slice().sort((a,b)=>b.ts-a.ts);
    g.innerHTML='';
    if(!list.length){ st.textContent='取件码「'+code+'」下还没有照片。'; empty.style.display=''; return; }
    for(const p of list){
      const d=document.createElement('div'); d.className='ph'+(quiet?' new':'');
      const img=document.createElement('img'); img.src='/uploads/'+p.file; img.loading='lazy'; img.alt='照片';
      img.onerror=()=>{ img.style.display='none'; };
      const m=document.createElement('div'); m.className='meta';
      const dt=new Date(p.ts), pad=n=>String(n).padStart(2,'0');
      m.textContent=`${pad(dt.getMonth()+1)}-${pad(dt.getDate())} ${pad(dt.getHours())}:${pad(dt.getMinutes())}`;
      d.append(img,m); g.appendChild(d);
    }
    g.style.display='';
    st.textContent=`取件码「${code}」共 ${list.length} 张照片。`;
  }catch(e){ st.textContent='读取失败：'+e.message; }
}
$('btnOpen').addEventListener('click', ()=>{
  const v=$('codeGet').value.trim();
  if(!/^\d{2}$/.test(v)){ toast('请输入两位数字'); return; }
  openBox(v);
});
$('codeGet').addEventListener('keydown', e=>{ if(e.key==='Enter') $('btnOpen').click(); });

/* ---------- 启动 ---------- */
(async function(){
  setCode(localStorage.getItem('boxcode') || randomCode());
  await detect();
})();
</script>
</body>
</html>
